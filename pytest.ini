[pytest]
# `pytest` from the project root must run the suite — not walk the vendored
# trees that live next to it (UI-TARS, AgentReach, node_modules, the 600 MB
# model directory). Tests are only ever collected from tests/.
testpaths = tests
# Keep pytest's scratch tree inside the project. On some Windows profiles the
# per-user %TEMP%\pytest-of-<user> directory is not writable (WinError 5), which
# makes every tmp_path-using test error out before it runs; a project-relative
# basetemp sidesteps that entirely and keeps generated files out of the repo.
addopts = --basetemp=.pytest_tmp
norecursedirs =
    UI-TARS
    AgentReach
    node_modules
    .venv
    venv
    models
    data
    assets
    knowledge
    docs
    build
    dist
    __pycache__
    .freebuff
    .pytest_cache
    .pytest_tmp

# tests/conftest.py forces QT_QPA_PLATFORM=offscreen and
# JARVIS_DISABLE_WEBENGINE=1, so a bare run never opens a window and never
# initialises Chromium.
